<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b7a4b">
<title>ÔN TẬP TỪ VỰNG VÀ NGỮ PHÁP THEO GIÁO TRÌNH HÁN NGỮ</title>
<style>
*{box-sizing:border-box}:root{--g:#0b7a4b;--g2:#2aa56f;--l:#eff9f4;--ink:#17352a;--m:#687a72;--line:#dcebe4}
body{margin:0;background:#f6faf8;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
button,input,select{font:inherit}button{cursor:pointer;border:0}.top{background:linear-gradient(135deg,#087344,#20a76e);color:#fff;padding:22px 18px 28px}
h1{margin:0;text-align:center;font-size:clamp(25px,6vw,42px);line-height:1.15}.top p{text-align:center;opacity:.92}
.bookbar{max-width:700px;margin:18px auto 0;background:#ffffff20;border:1px solid #ffffff42;border-radius:18px;padding:12px 16px;text-align:center}.book-title{font-size:20px;font-weight:900;display:block}.bookSelect{margin:8px 0;padding:9px 14px;border-radius:12px;border:0;font-weight:800;color:#17352a}.book-sub{font-size:13px;opacity:.9}.nav{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:18px}.nav button{background:#ffffff1c;color:#fff;border:1px solid #ffffff45;padding:10px 15px;border-radius:13px;font-weight:750}.nav button.active{background:#fff;color:var(--g)}
.wrap{max-width:1180px;margin:auto;padding:16px}.search{width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:16px;background:#fff}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:15px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;text-align:center}.stat b{display:block;font-size:28px;color:var(--g)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:13px 0}.toolbar>*{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff}
.section{display:none}.section.active{display:block}.lessonTitle{margin:22px 0 10px;padding:10px 14px;background:#e7f3ed;border-left:5px solid var(--g);border-radius:12px;color:var(--g)}
.vocab-card,.gcard,.quiz{background:#fff;border:1px solid var(--line);border-radius:20px;padding:17px;margin-bottom:13px;box-shadow:0 6px 20px #17352a08}
.vtop{display:flex;justify-content:space-between;gap:12px}.hanzi{font-size:46px;font-weight:850;color:var(--g)}.py{font-weight:750;color:#3b6f5a}.meaning{color:var(--m);margin-top:3px}
.badge{font-size:12px;background:var(--l);color:var(--g);padding:5px 9px;border-radius:999px;font-weight:800}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.actions button,.primary{background:var(--l);color:var(--g);padding:9px 12px;border-radius:12px;font-weight:800}.primary{background:var(--g);color:#fff}
.example{margin-top:12px;background:#f7fbf9;border:1px dashed #cfe4da;border-radius:13px;padding:12px}.example b{font-size:19px}.example .p{color:#3b6f5a}.example .vi{color:var(--m)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:13px}.formula{background:#f4f9f6;border-left:4px solid var(--g2);padding:10px;border-radius:9px;line-height:1.55}
.quiz .q{font-weight:800;margin-bottom:10px}.opts{display:grid;gap:8px}.opts button{text-align:left;background:#f5f8f7;border:1px solid var(--line);padding:10px 12px;border-radius:11px}.opts button.correct{background:#dff5e9}.opts button.wrong{background:#ffe9e6}.explain{color:var(--m);margin-top:8px}
.search-results{display:none;background:#fff;border:1px solid var(--line);border-radius:14px;margin-top:7px;overflow:hidden}.search-results button{width:100%;text-align:left;padding:11px 13px;background:#fff;border-bottom:1px solid #edf3f0}
.modal{display:none;position:fixed;inset:0;background:#12231dcc;z-index:50;padding:10px;align-items:center;justify-content:center}.modal.show{display:flex}.modalbox{background:#fff;width:min(96vw,900px);max-height:95vh;overflow:auto;border-radius:24px;padding:17px}
.mhead{display:flex;justify-content:space-between;align-items:center}.close{font-size:25px;background:#eef7f2;border-radius:12px;padding:5px 12px}.charGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:12px}
.strokeBox{height:280px;min-height:220px;border:1px solid #cce2d7;border-radius:16px;margin:8px auto;background:linear-gradient(#d8ebe2 1px,transparent 1px),linear-gradient(90deg,#d8ebe2 1px,transparent 1px);background-size:25% 25%;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.strokeBox canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair;user-select:none;-webkit-user-select:none}
.writeTools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.writeTools button{background:#eef8f3;color:var(--g);padding:9px 13px;border-radius:12px;font-weight:800;border:1px solid #d5e9df}
.writeTools button.clear{background:#fff1ef;color:#b54d43;border-color:#f0d3ce}.writeTools button.gradeWrite{background:#eaf7f1;color:#176b52;border-color:#bfe0d2}
.charHint{font-size:13px;color:var(--m);margin-top:6px}.bigChar{font-size:150px;font-weight:900;color:var(--g)}
.charCard{text-align:center;border:1px solid var(--line);border-radius:18px;padding:12px}.offline{background:#f1f8f4;padding:10px;border-radius:12px;color:#53675f;margin-top:12px}.footer{text-align:center;color:var(--m);padding:30px 10px}
@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}.hanzi{font-size:39px}}
.radicalInfo{margin:8px auto 10px;padding:9px 12px;background:#f3faf6;border-left:4px solid #2d9b74;border-radius:10px;color:#315d4d;font-size:14px;line-height:1.5;text-align:left}
.radicalInfo .radicalChar{font-size:24px;font-weight:900;color:#176348;margin:0 4px}
.radicalInfo .radicalName{font-weight:800;color:#176348}
.componentInfo{margin:7px auto 10px;padding:9px 12px;background:#fffaf0;border-left:4px solid #e1a24b;border-radius:10px;color:#5d4a2d;font-size:14px;line-height:1.55;text-align:left}
.componentInfo .componentTitle{font-weight:900;color:#a36b18}
.componentInfo .componentChar{font-size:23px;font-weight:900;color:#8a5a13;margin:0 3px}
.componentItem{display:inline-flex;align-items:center;gap:4px;margin:3px 7px 3px 0}
.componentMeaning{color:#66553d}

/* ===== GIAO DIỆN GIA LẠC - chỉ thay đổi presentation ===== */
:root{
  --g:#176b52; --g2:#2f9d73; --l:#edf7f1; --ink:#183b2f;
  --m:#62736c; --line:#dce9e2; --cream:#fbfaf4; --gold:#dca85a;
}
body{
  background:
    radial-gradient(circle at 10% 8%, rgba(220,236,216,.58), transparent 25%),
    radial-gradient(circle at 92% 18%, rgba(232,241,215,.62), transparent 24%),
    linear-gradient(180deg,#f8fbf7 0%,#f1f7f3 100%);
}
.top{
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 8% 20%, rgba(255,255,255,.98), transparent 22%),
    radial-gradient(circle at 93% 28%, rgba(255,255,255,.92), transparent 23%),
    linear-gradient(135deg,#fdfcf7 0%,#f5f7ed 48%,#eef6ef 100%);
  color:var(--ink);
  padding:22px 18px 20px;
  border-bottom:1px solid #dce9df;
  box-shadow:0 8px 28px rgba(24,59,47,.08);
}
.top:before,.top:after{
  content:""; position:absolute; pointer-events:none; opacity:.25;
  border-radius:50%; border:1px solid #b8cfbf;
}
.top:before{width:390px;height:390px;left:-245px;top:-250px}
.top:after{width:330px;height:330px;right:-220px;top:-210px}
.top h1{
  position:relative; z-index:2;
  max-width:820px; margin:0 auto;
  color:#17634d;
  font-weight:950; letter-spacing:.5px;
  text-shadow:0 1px 0 #fff;
}
.top p{
  position:relative;z-index:2;color:#52665e;
  font-weight:650; margin:10px auto 0;
}
.brand-logo{
  position:absolute; z-index:4; left:22px; top:18px;
  width:122px; height:122px; object-fit:contain;
  filter:drop-shadow(0 5px 10px rgba(20,65,48,.12));
}
.book-display{
  position:absolute; z-index:4; right:20px; top:10px;
  width:min(285px,23vw); max-height:175px; object-fit:contain;
  object-position:center right;
  filter:drop-shadow(0 8px 13px rgba(20,65,48,.16));
}
.bookbar{
  position:relative;z-index:3;
  max-width:720px; margin:16px auto 0;
  background:rgba(255,255,255,.74);
  border:1px solid #dbe8df;
  box-shadow:0 8px 20px rgba(26,74,56,.06);
  color:var(--ink);
}
.book-title{color:#17634d}
.bookSelect{
  background:#f1f7f2; border:1px solid #cfe2d6;
}
.nav{position:relative;z-index:3}
.nav button{
  background:#ffffffd9;color:#17634d;
  border:1px solid #d5e5dc;
  box-shadow:0 4px 12px rgba(24,59,47,.06);
}
.nav button.active{background:#176b52;color:#fff;border-color:#176b52}
.wrap{max-width:1240px}
.search{
  border-color:#d8e7df;
  box-shadow:0 5px 18px rgba(24,59,47,.05);
}
.stat{
  border-color:#dce9e2;
  box-shadow:0 5px 18px rgba(24,59,47,.05);
}
.stat b{color:#176b52}
.lessonTitle{
  background:linear-gradient(90deg,#e6f2e9,#f4f8f3);
  border-left-color:#2f9d73;
}
.vocab-card,.gcard,.quiz{
  border-color:#dce9e2;
  box-shadow:0 7px 22px rgba(24,59,47,.055);
}
.vocab-card:hover,.gcard:hover,.quiz:hover{
  transform:translateY(-1px);
  box-shadow:0 10px 28px rgba(24,59,47,.09);
}
.actions button,.primary{
  border:1px solid #d7e9df;
}
.example{
  background:#f6faf7;
  border-color:#cfe2d7;
}
.modal{background:rgba(20,38,31,.76)}
.modalbox{
  border:1px solid #dce9e2;
  box-shadow:0 20px 60px rgba(0,0,0,.18);
}
.strokeBox{
  background:
    linear-gradient(#d8e9e1 1px,transparent 1px),
    linear-gradient(90deg,#d8e9e1 1px,transparent 1px),
    #fff;
  background-size:25% 25%;
}
.footer{color:#718078}

/* Responsive: logo trái + bộ giáo trình phải vẫn gọn trên điện thoại */
@media(max-width:900px){
  .brand-logo{width:82px;height:82px;left:10px;top:10px}
  .book-display{width:170px;max-height:105px;right:8px;top:8px}
  .top h1{padding:42px 120px 0;font-size:clamp(22px,5.6vw,34px)}
  .top p{padding:0 90px}
}
@media(max-width:650px){
  .brand-logo{width:58px;height:58px;left:8px;top:8px}
  .book-display{width:118px;max-height:76px;right:5px;top:7px}
  .top{padding:13px 10px 16px}
  .top h1{padding:38px 66px 0;font-size:22px;line-height:1.13}
  .top p{padding:0 18px;font-size:12px}
  .bookbar{margin-top:12px}
}


/* ===== VIẾT CHỮ: xếp toàn bộ chữ theo hàng dọc ===== */
.charGrid{display:grid;grid-template-columns:1fr;gap:18px;margin-top:14px}
.charCard{width:100%;text-align:center;border:1px solid var(--line);border-radius:20px;padding:14px;background:#fff}
.charCard .strokeBox{width:min(100%,520px);height:360px;margin:10px auto}
.charCard .radicalInfo,.charCard .componentInfo,.charCard .mnemonicInfo{max-width:720px;margin-left:auto;margin-right:auto}
.mnemonicInfo{margin:8px auto 10px;padding:9px 12px;background:#fff8e9;border-left:4px solid #dca85a;border-radius:10px;color:#66502b;font-size:14px;line-height:1.55;text-align:left}
.mnemonicInfo .mnemonicTitle{font-weight:900;color:#a46e1a}
@media(max-width:650px){.charCard .strokeBox{height:300px}.charCard{padding:10px}.mnemonicInfo{font-size:13px}}


/* ===== Ô CHỮ HÀNG DỌC + LUYỆN VIẾT CÓ CHẤM NÉT ===== */
.charGrid{display:flex!important;flex-direction:column!important;align-items:center!important;gap:20px!important;width:100%}
.charCard{width:min(820px,100%);box-sizing:border-box;overflow:visible}
.strokeBox{width:min(620px,100%);height:360px;min-height:280px;margin:10px auto}
.strokeBox .bigChar{font-size:180px;line-height:1}
.mnemonicInfo{margin:7px auto 10px;padding:10px 13px;background:#fffdf2;border-left:4px solid #e1b34f;border-radius:10px;color:#5f4c27;font-size:14px;line-height:1.65;text-align:left}
.mnemonicTitle{font-weight:900;color:#a26d18}
.mnemonicText{white-space:pre-line;margin-top:4px}
.writeStatus{margin:8px auto 0;padding:9px 12px;border-radius:12px;font-weight:850;text-align:center;line-height:1.45}
.writeStatus.neutral{background:#f1f7f4;color:#356653;border:1px solid #d8e9e0}
.writeStatus.ok{background:#e9f8ee;color:#177344;border:1px solid #bfe2cb}
.writeStatus.bad{background:#fff0ed;color:#b94d3f;border:1px solid #f0c9c2}
.writeStatus.done{background:#eaf7f1;color:#176b52;border:1px solid #bfe0d2}
@media(max-width:650px){
  .charGrid{gap:15px!important}
  .charCard{padding:10px}
  .strokeBox{height:300px;min-height:250px}
  .strokeBox .bigChar{font-size:150px}
}

.writeStatus{min-height:20px}
.strokeBox canvas{position:relative;z-index:2;width:100%;height:100%;display:block;touch-action:none}
.strokeBox:has(canvas){background:#fff;overflow:hidden}
.writeAreaTools{width:min(620px,100%);margin:8px auto 0}
.writeAreaTools .writeTools{position:static!important;margin:0}
.writeAreaTools .writeStatus{margin-top:8px}

.mnemonicInfo{display:none;width:min(620px,100%);box-sizing:border-box;margin:8px auto;padding:11px 14px;background:#fff9e9;border:1px solid #ead9a8;border-left:4px solid #d9a441;border-radius:12px;color:#5f4b25;text-align:left;line-height:1.65}
.mnemonicInfo .mnemonicTitle{color:#9a6a16;font-weight:900}
.mnemonicInfo .mnemonicText{margin-top:4px;white-space:pre-line}
</style><script async src="https://unpkg.com/hanzi-writer@3.0.0/dist/hanzi-writer.min.js"></script>
</head>

xí Hànyǔ, yě liànxí shuō Hànyǔ。","Mỗi ngày tôi học tiếng Trung và cũng luyện nói tiếng Trung."],"难":["这个汉字有一点儿难，我要多写几遍。","Zhège Hànzì yǒu yìdiǎnr nán, wǒ yào duō xiě jǐ biàn。","Chữ Hán này hơi khó, tôi phải viết thêm vài lần."],"太":["今天太热了，我们晚上早点儿回家吧。","Jīntiān tài rè le, wǒmen wǎnshang zǎodiǎnr huí jiā ba。","Hôm nay nóng quá, tối nay chúng ta về nhà sớm một chút nhé."],"爸爸":["这是爸爸。 他今天也来学校上课。","Zhè shì bàba。 Tā jīntiān yě lái xuéxiào shàngkè。","Đây là bố; ba. Hôm nay người ấy cũng đến trường học."],"妈妈":["这是妈妈。 他今天也来学校上课。","Zhè shì māma。 Tā jīntiān yě lái xuéxiào shàngkè。","Đây là mẹ; má. Hôm nay người ấy cũng đến trường học."],"他":["他是我的同学，每天都跟我一起上课。","Tā shì wǒ de tóngxué, měitiān dōu gēn wǒ yìqǐ shàngkè。","Cậu ấy là bạn học của tôi, ngày nào cũng học cùng tôi."],"她":["她是我的同学，每天都跟我一起学习。","Tā shì wǒ de tóngxué, měitiān dōu gēn wǒ yìqǐ xuéxí。","Cô ấy là bạn học của tôi, ngày nào cũng học cùng tôi."],"男":["他是一个男学生。","Tā shì yí ge nán xuésheng。","Anh ấy là một nam sinh。"],"哥哥":["这是哥哥。 他今天也来学校上课。","Zhè shì gēge。 Tā jīntiān yě lái xuéxiào shàngkè。","Đây là anh trai. Hôm nay người ấy cũng đến trường học."],"弟弟":["这是弟弟。 他今天也来学校上课。","Zhè shì dìdi。 Tā jīntiān yě lái xuéxiào shàngkè。","Đây là em trai. Hôm nay người ấy cũng đến trường học."],"妹妹":["这是妹妹。 他今天也来学校上课。","Zhè shì mèimei。 Tā jīntiān yě lái xuéxiào shàngkè。","Đây là em gái. Hôm nay người ấy cũng đến trường học."],"学":["我每天学汉语。","Wǒ měitiān xué Hànyǔ。","Mỗi ngày tôi học tiếng Trung。"],"英语":["这是英语。 我每天都用它练习说话。","Zhè shì Yīngyǔ。 Wǒ měitiān dōu yòng tā liànxí shuōhuà。","Đây là tiếng Anh. Mỗi ngày tôi đều dùng nó để luyện nói."],"阿拉伯语":["我会说一点儿阿拉伯语。","Wǒ huì shuō yìdiǎnr Ālābóyǔ。","Tôi biết nói một chút Hôm nay chúng ta học từ “tiếng Ả Rập”.。"],"德语":["我觉得德语的发音不太容易。","Wǒ juéde Déyǔ de fāyīn bú tài róngyì。","Tôi thấy phát âm tiếng Đức không dễ lắm."],"俄语":["我会说一点儿俄语，还想继续学习。","Wǒ huì shuō yìdiǎnr Éyǔ, hái xiǎng jìxù xuéxí。","Tôi biết nói một chút tiếng Nga và còn muốn tiếp tục học."],"法语":["她会说法语，也会说一点儿英语。","Tā huì shuō Fǎ let currentBookKey="hanngu2", V=[], G=[], Q=[], EX={};
let answered=0,correct=0,currentWord=null;

function setBook(key){
  currentBookKey=key;
  const book=DATA.books[key];
  V=book.lessons?Object.values(book.lessons).flatMap(l=>l.vocab):[];
  G=book.lessons?Object.values(book.lessons).flatMap(l=>l.grammar):[];
  Q=book.lessons?Object.values(book.lessons).flatMap(l=>l.questions):[];
  EX=key==="hanngu1"?(DATA.examples_hanngu1||{}):(DATA.examples||{});
  document.getElementById("bookSub").textContent=book.description||"";
  document.getElementById("vcount").textContent=V.length;
  document.getElementById("lcount").textContent=Object.keys(book.lessons||{}).length;
  document.getElementById("gcount").textContent=G.length;
  document.getElementById("qcount").textContent=Q.length;
  document.getElementById("grammarTitle").textContent="📘 NGỮ PHÁP – "+book.name.toUpperCase();
  document.getElementById("quizTitle").textContent="🎯 LUYỆN TẬP – "+book.name.toUpperCase();
  lesson.innerHTML='<option value="all">Tất cả bài</option>';
  Object.values(book.lessons||{}).forEach(l=>{
    const o=document.createElement("option");
    o.value=l.name.replace("Bài ",""); o.textContent=l.name; lesson.appendChild(o);
  });
  lesson.value="all";
  renderVocab(); renderGrammar(); renderQuiz();
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function speak(t){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="zh-CN";u.rate=.82;speechSynthesis.speak(u)}catch(e){}}
function renderVocab(){
  let l=lesson.value,a=V.filter(x=>l==="all"||x[0]===l),last="",o="";
  a.forEach(x=>{
    if(x[0]!==last){o+=`<div class="lessonTitle">📚 BÀI ${x[0]}</div>`;last=x[0]}
    let ex=EX[x[1]];
    o+=`<article class="vocab-card"><div class="vtop"><div><div class="hanzi">${esc(x[1])}</div><div class="py">${esc(x[2])}</div><div class="meaning">${esc(x[3])}</div></div><span class="badge">Bài ${x[0]}</span></div>
    <div class="actions"><button onclick='speak(${JSON.stringify(x[1])})'>🔊 Phát âm</button><button onclick='openWriter(${JSON.stringify(x)})'>✍️ Viết chữ</button></div>
    ${ex?`<div class="example"><b>${esc(ex[0])}</b><div class="p">${esc(ex[1])}</div><div class="vi">${esc(ex[2])}</div><div class="actions"><button onclick='speak(${JSON.stringify(ex[0])})'>🔊 Đọc câu</button></div></div>`:""}</article>`;
  });
  vocabList.innerHTML=o;
}
function doSearch(){
  let q=search.value.trim().toLowerCase();
  if(!q){results.style.display="none";return}
  let a=V.filter(x=>x.join(" ").toLowerCase().includes(q)).slice(0,20);
  results.innerHTML=a.map(x=>`<button onclick='jump(${JSON.stringify(x[1])})'><b>${esc(x[1])}</b>　<span class="result-p">${esc(x[2])}</span>　<span class="result-m">${esc(x[3])}</span></button>`).join("");
  results.style.display=a.length?"block":"none";
}
function jump(ch){
  let x=V.find(v=>v[1]===ch); if(!x)return;
  results.style.display="none"; lesson.value=x[0]; renderVocab();
  setTimeout(()=>[...document.querySelectorAll(".vocab-card")].find(c=>c.querySelector(".hanzi")?.textContent===ch)?.scrollIntoView({behavior:"smooth",block:"center"}),60);
}
function renderGrammar(){
  let o="";
  const lessons=Object.values(DATA.books[currentBookKey].lessons||{});
  lessons.forEach(l=>{
    if(l.grammar?.length){
      o+=`<div class="lessonTitle" style="grid-column:1/-1">📘 BÀI ${l.name.replace("Bài ","")}</div>`;
      l.grammar.forEach(g=>o+=`<article class="gcard"><h3>${esc(g[1])}</h3><div class="formula">${esc(g[2])}</div></article>`);
    }
  });
  grammarList.innerHTML=o;
}
function renderQuiz(){
  quizList.innerHTML=Q.map((q,i)=>`<article class="quiz" id="q${i}"><div class="badge">Bài ${q[0]}</div><div class="q">${i+1}. ${esc(q[1])}</div><div class="opts">${q[2].map((o,j)=>`<button onclick="answerQ(${i},${j})">${String.fromCharCode(65+j)}. ${esc(o)}</button>`).join("")}</div><div class="explain" id="e${i}"></div></article>`).join("");
  score.textContent=`Điểm: 0 / ${Q.length}`;
}
function answerQ(i,j){
  let c=document.getElementById("q"+i); if(c.dataset.done)return;
  c.dataset.done=1;answered++;
  let b=c.querySelectorAll(".opts button"),ok=Q[i][3];
  b[ok].classList.add("correct"); if(j!==ok)b[j].classList.add("wrong"); else correct++;
  document.getElementById("e"+i).textContent="💡 "+Q[i][4];
  score.textContent=`Điểm: ${correct} / ${Q.length} · Đã làm: ${answered}`;
}
function resetQuiz(){answered=0;correct=0;renderQuiz()}
function openWriter(x){currentWord=x;document.body.style.overflow="hidden";modalWord.innerHTML=`<b>${esc(x[1])}</b> · ${esc(x[2])} · ${esc(x[3])}`;showChars();modal.classList.add("show");
}

let RADICAL_DATA=null, radicalLoading=null;
async function loadRadicalData(){
  if(RADICAL_DATA)return RADICAL_DATA;
  if(radicalLoading)return radicalLoading;
  radicalLoading=fetch("https://raw.githubusercontent.com/skishore/makemeahanzi/refs/heads/master/dictionary.txt")
    .then(r=>{if(!r.ok)throw new Error("character data unavailable");return r.text()})
    .then(txt=>{
      const map={};
      txt.split(/\r?\n/).forEach(line=>{
        if(!line.trim())return;
        try{
          const o=JSON.parse(line);
          if(o.character){
            map[o.character]={
              radical:o.radical||"",
              decomposition:o.decomposition||"",
              definition:o.definition||"",
              etymology:o.etymology||null
            };
          }
        }catch(e){}
      });
      RADICAL_DATA=map;
      try{localStorage.setItem("hanziRadicalData",JSON.stringify(map))}catch(e){}
      return map;
    })
    .catch(()=>{
      try{
        const cached=localStorage.getItem("hanziRadicalData");
        if(cached){RADICAL_DATA=JSON.parse(cached);return RADICAL_DATA}
      }catch(e){}
      return {};
    });
  return radicalLoading;
}

function getTopComponents(ids){
  if(!ids || ids==="？")return [];
  const ops={"⿰":2,"⿱":2,"⿴":2,"⿵":2,"⿶":2,"⿷":2,"⿸":2,"⿹":2,"⿺":2,"⿻":2,"⿲":3,"⿳":3};
  let i=0;
  function parse(){
    const ch=ids[i++];
    if(!ch)return null;
    if(ops[ch]){
      const n=ops[ch],children=[];
      for(let k=0;k<n;k++)children.push(parse());
      return {op:ch,children};
    }
    return {char:ch};
  }
  const tree=parse();
  return tree?.children ? tree.children.flatMap(flattenTree) : (tree?.char?[tree.char]:[]);
}
function flattenTree(node){
  if(!node)return [];
  if(node.char)return [node.char];
  return (node.children||[]).flatMap(flattenTree);
}
function getDirectComponents(ids){
  if(!ids || ids==="？")return [];
  const ops={"⿰":2,"⿱":2,"⿴":2,"⿵":2,"⿶":2,"⿷":2,"⿸":2,"⿹":2,"⿺":2,"⿻":2,"⿲":3,"⿳":3};
  let i=0;
  function parse(){
    const ch=ids[i++];
    if(!ch)return null;
    if(ops[ch]){
      const children=[];
      for(let k=0;k<ops[ch];k++)children.push(parse());
      return {op:ch,children};
    }
    return {char:ch};
  }
  const tree=parse();
  return tree?.children ? tree.children.filter(x=>x?.char).map(x=>x.char) : [];
}
function removeRadicalFromComponents(comps,rad){
  const out=[...comps];
  if(rad){
    const idx=out.indexOf(rad);
    if(idx>=0)out.splice(idx,1);
  }
  return out;
}
function getComponentMeaning(c,obj){
  if(COMPONENT_VI[c])return COMPONENT_VI[c];
  if(EXTRA_COMPONENT_VI[c])return EXTRA_COMPONENT_VI[c];
  if(RADICAL_NAMES[c])return RADICAL_NAMES[c];
  if(obj?.etymology){
    const e=obj.etymology;
    if(e.phonetic===c)return "gợi âm";
    if(e.semantic===c)return "gợi nghĩa";
  }
  return "cấu tạo chữ";
}

function getMnemonic(char,obj){
  if(CLASS_MNEMONICS[char]) return CLASS_MNEMONICS[char];
  return "";
}

function renderMnemonic(index,char){
  const el=document.getElementById("mnemonic_"+index);
  if(!el)return;
  const mn=getMnemonic(char,{});
  if(mn){
    el.innerHTML=`🧠 <span class="mnemonicTitle">Mẹo nhớ chữ:</span><div class="mnemonicText">${esc(mn)}</div>`;
    el.style.display="block";
  }else{
    el.innerHTML="";
    el.style.display="none";
  }
}

function renderRadical(index,char,info){
  const el=document.getElementById("radical_"+index);
  if(!el)return;
  const obj=(typeof info==="string")?{radical:info}:info||{};
  const rad=obj.radical||"";
  const name=RADICAL_NAMES[rad]||"";
  el.innerHTML=rad
    ? `🔹 <b>Bộ thủ:</b> <span class="radicalChar">${esc(rad)}</span>${name?` <span class="radicalName">(${esc(name)})</span>`:""}`
    : `🔹 <b>Bộ thủ:</b> <span>chưa có dữ liệu</span>`;

  const mnEl=document.getElementById("mnemonic_"+index);
  if(mnEl){
    const mn=getMnemonic(char,obj);
    mnEl.innerHTML=mn?`🧠 <span class="mnemonicTitle">Mẹo nhớ chữ:</span><div class="mnemonicText">${esc(mn)}</div>`:"";
    mnEl.style.display=mn?"block":"none";
  }
  const compEl=document.getElementById("component_"+index);
  if(!compEl)return;
  const comps=getTopComponents(obj.decomposition||"");
  const rest=removeRadicalFromComponents(comps,rad);
  if(!rest.length){
    compEl.innerHTML=`🧩 <span class="componentTitle">Phần còn lại:</span> <span class="componentMeaning">chữ đơn thể hoặc không có thành phần còn lại được dữ liệu nhận diện.</span>`;
    return;
  }
  compEl.innerHTML=`🧩 <span class="componentTitle">Phần còn lại:</span> ${
    rest.map(c=>{
      const vi=getComponentMeaning(c,obj);
      return `<span class="componentItem"><span class="componentChar">${esc(c)}</span><span class="componentMeaning">— ${esc(vi)}</span></span>`;
    }).join("")
  }`;
}

function makeCanvas(btn){
  const card=btn.closest(".charCard"), box=card?.querySelector(".strokeBox");
  const char=card?.dataset.char||"";
  if(!card||!box)return;
  // Stop the animated guide if it was previously opened.
  if(card._hanziWriter){
    try{card._hanziWriter.cancelQuiz?.(); card._hanziWriter.hideCharacter?.({duration:0});}catch(e){}
    card._hanziWriter=null;
  }

  // Remove previous writing controls/status from this card.
  card.querySelector(".writeAreaTools")?.remove();

  box.innerHTML=`<canvas aria-label="Ô tự viết chữ Hán"></canvas>`;
  const tools=document.createElement("div");
  tools.className="writeAreaTools";
  tools.innerHTML=`
    <div class="writeTools">
      <button type="button" onclick="undoStroke(this)">↩ Hoàn tác</button>
      <button type="button" onclick="redoStroke(this)">↪ Làm lại</button>
      <button type="button" class="clear" onclick="clearWriting(this)">🗑 Xóa</button>
      <button type="button" class="gradeWrite" onclick='gradeWriting(this,${JSON.stringify(char)})'>✓ Chấm nét</button>
    </div>
    <div class="writeStatus neutral">✍️ Hãy viết chữ mờ ở chính giữa ô.</div>`;
  box.insertAdjacentElement("afterend",tools);

  const cv=box.querySelector("canvas");
  const dpr=Math.max(1,Math.min(window.devicePixelRatio||1,3));
  const state={strokes:[],redo:[],current:null,char};
  cv._writeState=state;

  const resize=()=>{
    const r=cv.getBoundingClientRect();
    const old=state.strokes;
    cv.width=Math.max(1,Math.floor(r.width*dpr));
    cv.height=Math.max(1,Math.floor(r.height*dpr));
    const ctx=cv.getContext("2d");
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.lineWidth=Math.max(3,Math.min(6,r.width/120));
    ctx.lineCap="round";ctx.lineJoin="round";
    redraw();
  };
  const point=e=>{
    const r=cv.getBoundingClientRect();
    return {x:e.clientX-r.left,y:e.clientY-r.top};
  };
  const redraw=()=>{
    const r=cv.getBoundingClientRect(),ctx=cv.getContext("2d");
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,r.width,r.height);

    // Faint centered guide.
    const size=Math.min(r.width,r.height)*.62;
    ctx.save();
    ctx.font=`900 ${size}px "Noto Sans CJK SC","Microsoft YaHei","SimSun",sans-serif`;
    ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillStyle="#b9d8ca";ctx.globalAlpha=.30;
    ctx.fillText(char,r.width/2,r.height/2-8);
    ctx.restore();

    ctx.lineWidth=Math.max(3,Math.min(6,r.width/120));
    ctx.lineCap="round";ctx.lineJoin="round";
    const drawStroke=st=>{
      if(!st.length)return;
      ctx.beginPath();ctx.moveTo(st[0].x,st[0].y);
      for(let i=1;i<st.length;i++)ctx.lineTo(st[i].x,st[i].y);
      ctx.stroke();
    };
    state.strokes.forEach(drawStroke);
    if(state.current)drawStroke(state.current);
  };

  requestAnimationFrame(resize);
  window.addEventListener("resize",resize,{once:true});

  cv.addEventListener("pointerdown",e=>{
    e.preventDefault();
    cv.setPointerCapture?.(e.pointerId);
    state.current=[point(e)];state.redo=[];redraw();
    const st=tools.querySelector(".writeStatus");
    if(st){st.className="writeStatus neutral";st.textContent="✍️ Đang viết…";}
  },{passive:false});
  cv.addEventListener("pointermove",e=>{
    if(!state.current)return;
    e.preventDefault();
    const pt=point(e),last=state.current[state.current.length-1];
    if(Math.hypot(pt.x-last.x,pt.y-last.y)>.7){state.current.push(pt);redraw();}
  },{passive:false});
  const finish=e=>{
    if(!state.current)return;
    e?.preventDefault();
    if(state.current.length>1)state.strokes.push(state.current);
    state.current=null;redraw();
  };
  cv.addEventListener("pointerup",finish,{passive:false});
  cv.addEventListener("pointercancel",finish,{passive:false});
  cv.addEventListener("pointerleave",e=>{if(e.buttons===0)finish(e)},{passive:false});

  btn.dataset.writerReady="1";
  btn.textContent="🖐 Tự viết lại";
}
async function gradeWriting(btn,char){
  const card=btn.closest(".charCard"),cv=card?.querySelector("canvas"),state=cv?._writeState;
  const status=card?.querySelector(".writeStatus");
  if(!state||!status)return;

  if(!state.strokes.length){
    status.className="writeStatus bad";
    status.textContent="⚠️ Bạn chưa viết nét nào. Hãy viết chữ trước rồi bấm “Chấm nét”.";
    return;
  }

  status.className="writeStatus neutral";
  status.textContent="⏳ Đang kiểm tra bài viết…";

  // Stable offline-friendly grading:
  // 1) compare number of user strokes with the official stroke count;
  // 2) compare each stroke's general direction and relative length.
  // The official stroke count is obtained from HanziWriter when available.
  let expected=null;
  try{
    if(typeof HanziWriter!=="undefined"){
      const host=document.createElement("div");
      host.style.cssText="position:fixed;left:-10000px;top:0;width:100px;height:100px;opacity:0;pointer-events:none";
      document.body.appendChild(host);
      const w=HanziWriter.create(host,char,{width:100,height:100,padding:5,showCharacter:false,showOutline:false});
      expected=w?._character?.strokes?.length || null;
      try{w?.cancel?.();}catch(e){}
      host.remove();
    }
  }catch(e){ expected=null; }

  // Fallback: if the library cannot load, still provide a useful check.
  const user=state.strokes.filter(x=>x.length>1);
  const strokeCountOK=expected==null ? true : user.length===expected;

  const box=cv.getBoundingClientRect();
  const diag=Math.hypot(box.width,box.height)||1;
  const features=user.map(st=>{
    const first=st[0], last=st[st.length-1];
    const dx=last.x-first.x, dy=last.y-first.y;
    const len=st.reduce((sum,p,i)=>i?sum+Math.hypot(p.x-st[i-1].x,p.y-st[i-1].y):0,0);
    const angle=Math.atan2(dy,dx);
    return {len:len/diag,angle,dx,dy};
  });

  // Basic handwriting sanity checks: extremely tiny strokes are marked as suspicious.
  const tiny=features.filter(f=>f.len<0.025).length;
  const suspicious=tiny;

  let msg="";
  if(strokeCountOK && suspicious===0){
    msg=expected
      ? `🎉 Số nét khớp: ${user.length}/${expected}. Bài viết đạt yêu cầu cơ bản.`
      : `✓ Đã viết ${user.length} nét. Bài viết đạt yêu cầu cơ bản.`;
    status.className="writeStatus done";
  }else{
    const parts=[];
    if(expected!=null && !strokeCountOK) parts.push(`đang có ${user.length} nét, cần ${expected} nét`);
    if(suspicious) parts.push(`${suspicious} nét quá ngắn`);
    msg=`✗ Chưa đạt: ${parts.join(" và ")}. Hãy xem lại hướng dẫn rồi viết lại.`;
    status.className="writeStatus bad";
  }

  status.textContent=msg;
  btn.textContent="✓ Chấm lại";
}

function getWriteState(btn){
  return btn.closest(".charCard")?.querySelector("canvas")?._writeState || null;
}
function undoStroke(btn){
  const s=getWriteState(btn); if(!s||!s.strokes.length)return;
  s.redo.push(s.strokes.pop()); redrawExternal(btn);
}
function redoStroke(btn){
  const s=getWriteState(btn); if(!s||!s.redo.length)return;
  s.strokes.push(s.redo.pop()); redrawExternal(btn);
}
function clearWriting(btn){
  const s=getWriteState(btn); if(!s)return;
  s.strokes=[];s.redo=[];s.current=null;redrawExternal(btn);
}
function redrawExternal(btn){
  const card=btn.closest(".charCard"),cv=card?.querySelector("canvas"),st=cv?._writeState;
  if(!cv||!st)return;
  const r=cv.getBoundingClientRect(),dpr=Math.max(1,Math.min(window.devicePixelRatio||1,3));
  const ctx=cv.getContext("2d");
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,r.width,r.height);
  const size=Math.min(r.width,r.height)*.62;
  ctx.save();
  ctx.font=`900 ${size}px "Noto Sans CJK SC","Microsoft YaHei","SimSun",sans-serif`;
  ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillStyle="#b9d8ca";ctx.globalAlpha=.30;
  ctx.fillText(st.char,r.width/2,r.height/2-8);
  ctx.restore();
  ctx.lineWidth=Math.max(3,Math.min(6,r.width/120));ctx.lineCap="round";ctx.lineJoin="round";
  st.strokes.forEach(x=>{
    if(!x.length)return;
    ctx.beginPath();ctx.moveTo(x[0].x,x[0].y);
    for(let i=1;i<x.length;i++)ctx.lineTo(x[i].x,x[i].y);
    ctx.stroke();
  });
}
function practiceAll(){if(!currentWord)return;let b=charGrid.querySelector(".charCard .writePracticeBtn");if(b)b.click()}
function ensureHanziWriter(){
  if(window.HanziWriter) return Promise.resolve(window.HanziWriter);
  if(window._hanziWriterPromise) return window._hanziWriterPromise;
  window._hanziWriterPromise=new Promise((resolve,reject)=>{
    const sc=document.createElement("script");
    sc.src="https://unpkg.com/hanzi-writer@3.0.0/dist/hanzi-writer.min.js";
    sc.async=true;
    sc.onload=()=>resolve(window.HanziWriter);
    sc.onerror=()=>reject(new Error("HanziWriter load failed"));
    document.head.appendChild(sc);
  });
  return window._hanziWriterPromise;
}

async function showInlineGuide(btn,char,index){
  const card=btn.closest(".charCard"), box=card?.querySelector(".strokeBox");
  if(!card||!box)return;
  if(card._hanziWriter){
    try{
      card._hanziWriter.cancelQuiz?.();
      card._hanziWriter.hideCharacter({duration:0});
      card._hanziWriter.showOutline({duration:0});
      card._hanziWriter.animateCharacter();
      btn.textContent="🔁 Xem lại hướng dẫn";
    }catch(e){}
    return;
  }
  box.innerHTML=`<div id="inlineWriter_${index}" style="width:100%;height:100%;touch-action:none;display:flex;align-items:center;justify-content:center;color:#62736c">⏳ Đang tải hướng dẫn viết…</div>`;
  try{
    const HW=await ensureHanziWriter();
    const writer=HW.create(document.getElementById("inlineWriter_"+index),char,{
      width:280,height:280,padding:10,
      showOutline:true,showCharacter:false,
      strokeAnimationSpeed:1.2,delayBetweenStrokes:220,
      strokeColor:"#236f58",radicalColor:"#d67b2f",
      outlineColor:"#b8d7ca",highlightColor:"#e19b42",
      showHintAfterMisses:1,highlightOnComplete:true
    });
    card._hanziWriter=writer;
    btn.textContent="🔁 Xem lại hướng dẫn";
    setTimeout(()=>{try{writer.animateCharacter()}catch(e){}},80);
  }catch(e){
    box.innerHTML=`<div class="bigChar">${esc(char)}</div>`;
  }
}
