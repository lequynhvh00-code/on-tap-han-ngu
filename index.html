DATA.examples_hanngu3={"变化":["最近几年，这座城市变化很大。","Zuìjìn jǐ nián, zhè zuò chéngshì biànhuà hěn dà。","Trong vài năm gần đây, thành phố này thay đổi rất nhiều。"],"暑假":["我很喜欢暑假。","Wǒ hěn xǐhuan shǔjià。","Tôi rất thích kỳ nghỉ hè."],"还":["他还在图书馆学习。","Tā hái zài túshūguǎn xuéxí。","Anh ấy vẫn đang học ở thư viện。"],"比":["今天比昨天暖和。","Jīntiān bǐ zuótiān nuǎnhuo。","Hôm nay ấm hơn hôm qua。"],"人口":["北京的人口很多。","Běijīng de rénkǒu hěn duō。","Dân số Bắc Kinh rất đông。"],"最":["我最喜欢秋天。","Wǒ zuì xǐhuan qiūtiān。","Tôi thích mùa thu nhất。"],"城市":["我很喜欢城市。","Wǒ hěn xǐhuan chéngshì。","Tôi rất thích thành phố."],"增加":["今年来这里旅游的人增加了。","Jīnnián lái zhèlǐ lǚyóu de rén zēngjiā le。","Năm nay số người đến đây du lịch đã tăng lên。"],"建筑":["北京有很多古老的建筑。","Běijīng yǒu hěn duō gǔlǎo de jiànzhù。","Bắc Kinh có rất nhiều công trình kiến trúc cổ。"],"过去":["过去几年，这里的生活变化很大。","Guòqù jǐ nián, zhèlǐ de shēnghuó biànhuà hěn dà。","Vài năm qua, cuộc sống ở đây thay đổi rất nhiều。"],"变":["天气变冷了。","Tiānqì biàn lěng le。","Thời tiết trở lạnh rồi。"],"更":["冬天的时候，北方比南方更冷。","Dōngtiān de shíhou, běifāng bǐ nánfāng gèng lěng。","Vào mùa đông, miền Bắc lạnh hơn miền Nam。"],"漂亮":["秋天的山很漂亮。","Qiūtiān de shān hěn piàoliang。","Núi vào mùa thu rất đẹp。"],"冬天":["北京的冬天很冷。","Běijīng de dōngtiān hěn lěng。","Mùa đông ở Bắc Kinh rất lạnh。"],"暖和":["这个地方很暖和。","Zhège dìfang hěn nuǎnhuo。","Nơi này rất ấm áp."],"可是":["他可是来这里。","Tā kěshì lái zhèlǐ。","Anh ấy nhưng đến đây."],"暖气":["冬天屋里有暖气，一点儿也不冷。","Dōngtiān wū lǐ yǒu nuǎnqì, yìdiǎnr yě bù lěng。","Mùa đông trong nhà có hệ thống sưởi nên không lạnh chút nào。"],"天气":["今天的天气很好。","Jīntiān de tiānqì hěn hǎo。","Thời tiết hôm nay rất đẹp。"],"预报":["天气预报说明天会下雨。","Tiānqì yùbào shuō míngtiān huì xiàyǔ。","Dự báo thời tiết nói ngày mai sẽ mưa。"],"气温":["今天的气温很高。","Jīntiān de qìwēn hěn gāo。","Nhiệt độ hôm nay rất cao。"],"高":["今天的气温很高。","Jīntiān de qìwēn hěn gāo。","Nhiệt độ hôm nay rất cao。"],"度":["今天最高气温三十度。","Jīntiān zuìgāo qìwēn sānshí dù。","Nhiệt độ cao nhất hôm nay là 30 độ。"],"屋子":["这个屋子又大又暖和。","Zhège wūz async function gradeWriting(btn,char){ const card=btn.closest(".charCard"),cv=card?.querySelector("canvas"),state=cv?._writeState; const status=card?.querySelector(".writeStatus"); if(!state||!status)return; if(!state.strokes.length){ status.className="writeStatus bad"; status.textContent="⚠️ Bạn chưa viết nét nào. Hãy viết chữ trước rồi bấm “Chấm nét”."; return; } status.className="writeStatus neutral"; status.textContent="⏳ Đang kiểm tra bài viết…"; // Stable offline-friendly grading: // 1) compare number of user strokes with the official stroke count; // 2) compare each stroke's general direction and relative length. // The official stroke count is obtained from HanziWriter when available. let expected=null; try{ if(typeof HanziWriter!=="undefined"){ const host=document.createElement("div"); host.style.cssText="position:fixed;left:-10000px;top:0;width:100px;height:100px;opacity:0;pointer-events:none"; document.body.appendChild(host); const w=HanziWriter.create(host,char,{width:100,height:100,padding:5,showCharacter:false,showOutline:false}); expected=w?._character?.strokes?.length || null; try{w?.cancel?.();}catch(e){} host.remove(); } }catch(e){ expected=null; } // Fallback: if the library cannot load, still provide a useful check. const user=state.strokes.filter(x=>x.length>1); const strokeCountOK=expected==null ? true : user.length===expected; const box=cv.getBoundingClientRect(); const diag=Math.hypot(box.width,box.height)||1; const features=user.map(st=>{ const first=st[0], last=st[st.length-1]; const dx=last.x-first.x, dy=last.y-first.y; const len=st.reduce((sum,p,i)=>i?sum+Math.hypot(p.x-st[i-1].x,p.y-st[i-1].y):0,0); const angle=Math.atan2(dy,dx); return {len:len/diag,angle,dx,dy}; }); // Basic handwriting sanity checks: extremely tiny strokes are marked as suspicious. const tiny=features.filter(f=>f.len<0.025).length; const suspicious=tiny; let msg=""; if(strokeCountOK && suspicious===0){ msg=expected ? `🎉 Số nét khớp: ${user.length}/${expected}. Bài viế
