/* ===== GIAO DIỆN GIA LẠC - chỉ thay đổi presentation ===== */
:root{
  --g:#176b52; --g2:#2f9d73; --l:#edf7f1; --ink:#183b2f;
  --m:#62736c; --line:#dce9e2; --cream:#fbfaf4; --gold:#dca85a;
}
body{
  background:
    radial-gradient(circle at 10% 8%, rgba(220,236,216,.58), transparent 25%),
    radial-gradient(circle at 92% 18%, rgba(232,241,215,.62), transparent 24%),
    linear-gradient(180deg,#f8fbf7 0%,#f1f7f3 100%);
}
.top{
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 8% 20%, rgba(255,255,255,.98), transparent 22%),
    radial-gradient(circle at 93% 28%, rgba(255,255,255,.92), transparent 23%),
    linear-gradient(135deg,#fdfcf7 0%,#f5f7ed 48%,#eef6ef 100%);

  padding:22px 18px 20px;
  border-bottom:1px solid #dce9df;
  box-shadow:0 8px 28px rgba(24,59,47,.08);
}
.top:before,.top:after{
  content:""; position:absolute; pointer-events:none; opacity:.25;
  border-radius:50%; border:1px solid #b8cfbf;
}
.top:before{width:390px;height:390px;left:-245px;top:-250px}
.top:after{width:330px;height:330px;right:-220px;top:-210px}
.top h1{

}

  position:relative;z-index:2;color:#52665e;

}
.brand-logo{

  filter:drop-shadow(0 5px 10px rgba(20,65,48,.12));
}
.book-display{
  position:absolute; z-index:4; right:20px; top:10px;
  width:min(285px,23vw); max-height:175px; object-fit:contain;
  object-position:center right;
  filter:drop-shadow(0 8px 13px rgba(20,65,48,.16));
}
.bookbar{
  position:relative;z-index:3;
  max-width:720px; margin:16px auto 0;
  background:rgba(255,255,255,.74);
  border:1px solid #dbe8df;
  box-shadow:0 8px 20px rgba(26,74,56,.06);
  color:var(--ink);
}
.book-title{color:#17634d}
.bookSelect{
  background:#f1f7f2; border:1px solid #cfe2d6;
}
.nav{position:relative;z-index:3}

  background:#ffffffd9;color:#17634d;
  border:1px solid #d5e5dc;
  box-shadow:0 4px 12px rgba(24,59,47,.06);
}
.nav button.active{background:#176b52;color:#fff;border-color:#176b52}
.wrap{max-width:1240px}
.search{
  border-color:#d8e7df;
  box-shadow:0 5px 18px rgba(24,59,47,.05);
}
.stat{
  border-color:#dce9e2;
  box-shadow:0 5px 18px rgba(24,59,47,.05);
}

.lessonTitle{
  background:linear-gradient(90deg,#e6f2e9,#f4f8f3);
  border-left-color:#2f9d73;
}
.vocab-card,.gcard,.quiz{
  border-color:#dce9e2;
  box-shadow:0 7px 22px rgba(24,59,47,.055);
}
.vocab-card:hover,.gcard:hover,.quiz:hover{

  box-shadow:0 20px 60px rgba(0,0,0,.18);

  background:
    linear-gradient(#d8e9e1 1px,transparent 1px),
    linear-gradient(90deg,#d8e9e1 1px,transparent 1px),

let currentBookKey="hanngu1", V=[], G=[], Q=[], EX={};
let answered=0,correct=0,currentWord=null;

function setBook(key){
  currentBookKey=key;
  const book=DATA.books[key];
  V=book.lessons?Object.values(book.lessons).flatMap(l=>l.vocab):[];
  G=book.lessons?Object.values(book.lessons).flatMap(l=>l.grammar):[];
  Q=book.lessons?Object.values(book.lessons).flatMap(l=>l.questions):[];
  EX=key==="hanngu1"?(DATA.examples_hanngu1||{}):(key==="hanngu3"?(DATA.examples_hanngu3||{}):(DATA.examples||{}));
  document.getElementById("bookSub").textContent=book.description||"";
  document.getElementById("vcount").textContent=V.length;
  document.getElementById("lcount").textContent=Object.keys(book.lessons||{}).length;
  document.getElementById("gcount").textContent=G.length;
  document.getElementById("qcount").textContent=Q.length;
  document.getElementById("grammarTitle").textContent="📘 NGỮ PHÁP – "+book.name.toUpperCase();
  document.getElementById("quizTitle").textContent="🎯 LUYỆN TẬP – "+book.name.toUpperCase();
  lesson.innerHTML='<option value="all">Tất cả bài</option>';
  Object.values(book.lessons||{}).forEach(l=>{
    const o=document.createElement("option");
    o.value=l.name.replace("Bài ",""); o.textContent=l.name; lesson.appendChild(o);
  });
  lesson.value="all";
  renderVocab(); renderGrammar(); renderQuiz();
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function speak(t){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="zh-CN";u.rate=.82;speechSynthesis.speak(u)}catch(e){}}
function renderVocab(){
  let l=lesson.value,a=V.filter(x=>l==="all"||x[0]===l),last="",o="";
  a.forEach((x,idx)=>{
    if(x[0]!==last){o+=`<div class="lessonTitle">📚 BÀI ${x[0]}</div>`;last=x[0]}
    let ex=EX[x[1]];
    const aid=`analysis_${String(x[0])}_${idx}`;
    o+=`<article class="vocab-card" data-word="${esc(x[1])}" data-analysis-id="${aid}"><div class="vtop"><div><div class="hanzi">${esc(x[1])}</div><div class="py">${esc(x[2])}</div><div class="meaning">${esc(x[3])}</div></div><span class="badge">Bài ${x[0]}</span></div>
    <div class="actions"><button onclick='speak(${JSON.stringify(x[1])})'>🔊 Phát âm</button><button onclick='openWriter(${JSON.stringify(x)})'>✍️ Viết chữ</button></div>
    <div class="vocab-analysis" id="${aid}"><button class="vocab-analysis-toggle" type="button" onclick="toggleVocabAnalysis(this)">🧩 Bộ thủ · Chiết tự · 🧠 Mẹo nhớ chữ Hán</button><div class="vocab-analysis-body"><div class="analysis-loading">Đang chuẩn bị dữ liệu bộ thủ và chiết tự…</div></div></div>
    ${ex?`<div class="example"><b>${esc(ex[0])}</b><div class="p">${esc(ex[1])}</div><div class="vi">${esc(ex[2])}</div><div class="actions"><button onclick='speak(${JSON.stringify(ex[0])})'>🔊 Đọc câu</button></div></div>`:""}</article>`;
  });
  vocabList.innerHTML=o;
  hydrateVocabAnalysis();
}
function toggleVocabAnalysis(btn){
  const box=btn.closest('.vocab-analysis');
  if(!box)return;
  box.classList.toggle('open');
  if(box.classList.contains('open') && !box.dataset.ready) hydrateOneVocabAnalysis(box);
}
function hydrateOneVocabAnalysis(box){
  if(!box || box.dataset.ready)return;
  const card=box.closest('.vocab-card');
  const word=card?.dataset.word||'';
  const rows=V.filter(x=>x[1]===word);
  const row=rows[0];
  const body=box.querySelector('.vocab-analysis-body');
  if(!row||!body)return;
  const html=[...word].filter(c=>/^[\u3400-\u9fff]$/.test(c)).map(c=>renderWordCharAnalysis(c,row[3])).join('');
  const radicalSummary=[...word].filter(c=>/^[\u3400-\u9fff]$/.test(c)).map(c=>{
    const r=getPrimaryRadical(c);
    return r?`<span class="radicalSummaryChar">${esc(c)} → ${formatRadicalInline(r)}</span>`:`<span class="radicalSummaryChar">${esc(c)} → chưa xác định</span>`;
  }).join(' <span class="radicalSep">＋</span> ');
  body.innerHTML=(radicalSummary?`<div class="radicalSummary"><b>🔹 Bộ thủ theo từng chữ:</b> ${radicalSummary}</div>`:'')+html+`<div class="char-analysis-note">💡 <b>Lưu ý:</b> Một từ có thể có nhiều bộ thủ vì mỗi chữ có một bộ thủ riêng. Không lấy các thành phần nằm sâu bên trong chiết tự làm bộ thủ của chữ.</div>`;
  box.dataset.ready='1';
}
function hydrateVocabAnalysis(){
  loadRadicalData().then(()=>{
    document.querySelectorAll('.vocab-analysis.open').forEach(box=>{
      delete box.dataset.ready;
      hydrateOneVocabAnalysis(box);
    });
  });
}
function getPrimaryRadical(char){
  const info=RADICAL_DATA[char]||{};
  if(info && typeof info.radical === "string" && info.radical.trim()) return info.radical.trim();
  return RADICAL_FALLBACK[char]||"";
}

function renderWordCharAnalysis(char,wordMeaning){
  const info=getStaticCharInfo(char,RADICAL_DATA[char]||{});
  // Bộ thủ được lấy THEO TỪNG CHỮ trong từ.
  // Có thể có nhiều bộ thủ trong một TỪ (mỗi chữ một bộ thủ),
  // nhưng KHÔNG gom tất cả thành phần lồng nhau của một chữ thành bộ thủ.
  const radical = getPrimaryRadical(char);
  const radicals = radical ? [radical] : [];
  const tree=parseDecomposition(info.decomposition||'');
  const structure=tree?.op?componentStructureLabel(tree.op):'';
  const comps=tree?collectTreeChars(tree,[]).filter(c=>c!==char):[];
  const uniq=[...new Set(comps)];
  const compText=uniq.length?uniq.map(c=>{
    const m=COMPONENT_VI[c]||EXTRA_COMPONENT_VI[c]||RADICAL_MEANINGS[c]||RADICAL_NAMES[c]||'thành phần';
    const p=COMPONENT_PINYIN[c]||'';
    return `<span class="componentChar">${esc(c)}</span>${p?` <span class="componentName">${esc(p)}</span>`:''} — ${esc(m)}`;
  }).join(' ＋ '):'Chưa có phân rã chi tiết trong dữ liệu đang tải';
  const mn=getMnemonic(char,info,wordMeaning);
  return `<div class="char-analysis"><div class="char-analysis-head"><span class="char-analysis-char">${esc(char)}</span><span class="char-analysis-py">${esc(info.pinyin||COMPONENT_PINYIN[char]||'')}</span></div>
    <div class="char-analysis-radical">🔹 <b>Bộ thủ của chữ ${esc(char)}:</b> ${radicals.length?radicals.map(formatRadicalInline).join(' ＋ '):'chưa xác định'}</div>
    <div class="char-analysis-structure">🧩 <b>Chiết tự:</b> ${structure?esc(structure)+' · ':''}${compText}</div>
    ${mn?`<div class="char-analysis-mnemonic">🧠 <b>Mẹo nhớ:</b> ${esc(mn)}</div>`:''}</div>`;
}

function normalizeSearchText(text){
  return String(text||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d");
}
function doSearch(){
  const q=normalizeSearchText(search.value.trim());
  if(!q){results.style.display="none";return}
  const a=V.filter(x=>[x[1],x[2],x[3]].map(normalizeSearchText).some(v=>v.includes(q))).slice(0,20);
  results.innerHTML=a.map(x=>`<button type="button" class="search-result-item" onclick='event.preventDefault();jumpToWord(${JSON.stringify(x[1])},${JSON.stringify(x[0])})'><b>${esc(x[1])}</b> <span class="result-p">${esc(x[2])}</span> <span class="result-m">${esc(x[3])}</span></button>`).join("");
  results.style.display=a.length?"block":"none";
}
function jumpToWord(ch,lessonNo){
  document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));
  document.querySelector('.nav button[data-sec="vocab"]')?.classList.add("active");
  document.querySelectorAll(".section").forEach(sec=>sec.classList.remove("active"));
  document.getElementById("vocab")?.classList.add("active");
  const target=String(lessonNo);
  lesson.value=[...lesson.options].some(o=>o.value===target)?target:"all";
  renderVocab(); results.style.display="none";
  requestAnimationFrame(()=>{
    const card=[...document.querySelectorAll(".vocab-card")].find(c=>c.querySelector(".hanzi")?.textContent.trim()===String(ch).trim());
    if(card){
      card.classList.add("search-found");
      card.scrollIntoView({behavior:"smooth",block:"center"});
      setTimeout(()=>card.classList.remove("search-found"),1800);
    }
  });
}
function jump(ch){
  const x=V.find(v=>v[1]===ch); if(x)jumpToWord(x[1],x[0]);
}
function formatGrammarDetail(text){
  return esc(String(text||""))
    .replace(/&lt;b&gt;/g,"<b>")
    .replace(/&lt;\/b&gt;/g,"</b>")
    .replace(/\n/g,"<br>");
}
function renderGrammar(){
  let o="";
  const lessons=Object.values(DATA.books[currentBookKey].lessons||{});
  lessons.forEach(l=>{
    if(l.grammar?.length){
      o+=`<div class="lessonTitle" style="grid-column:1/-1">📘 BÀI ${l.name.replace("Bài ","")}</div>`;
      l.grammar.forEach(g=>{
        o+=`<article class="gcard">
          <h3>${esc(g[1])}</h3>
          <div class="formula grammarStructured">${formatGrammarDetail(g[2]||"")}</div>
        </article>`;
      });
    }
  });
  grammarList.innerHTML=o;
}
function renderQuiz(){
  quizList.innerHTML=Q.map((q,i)=>`<article class="quiz" id="q${i}"><div class="badge">Bài ${q[0]}</div><div class="q">${i+1}. ${esc(q[1])}</div><div class="opts">${q[2].map((o,j)=>`<button onclick="answerQ(${i},${j})">${String.fromCharCode(65+j)}. ${esc(o)}</button>`).join("")}</div><div class="explain" id="e${i}"></div></article>`).join("");
  score.textContent=`Điểm: 0 / ${Q.length}`;
}
function answerQ(i,j){
  let c=document.getElementById("q"+i); if(c.dataset.done)return;
  c.dataset.done=1;answered++;
  let b=c.querySelectorAll(".opts button"),ok=Q[i][3];
  b[ok].classList.add("correct"); if(j!==ok)b[j].classList.add("wrong"); else correct++;
  document.getElementById("e"+i).textContent="💡 "+Q[i][4];
  score.textContent=`Điểm: ${correct} / ${Q.length} · Đã làm: ${answered}`;
}

let RADICAL_DATA={};
const RADICAL_DATA_STATIC={};

let RADICAL_SOURCE_READY=false;
async function loadRadicalData(){
  if(RADICAL_SOURCE_READY && Object.keys(RADICAL_DATA).length) return RADICAL_DATA;
  try{
    const url="https://raw.githubusercontent.com/skishore/makemeahanzi/master/dictionary.txt";
    const res=await fetch(url,{cache:"force-cache"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const txt=await res.text();
    const need=new Set();
    // Lấy toàn bộ chữ của Hán Ngữ 1–3, không chỉ DATA.vocab cũ.
    if(Array.isArray(DATA.vocab)) DATA.vocab.forEach(row=>{ if(row&&row[1]) [...row[1]].forEach(ch=>need.add(ch)); });
    Object.values(DATA.books||{}).forEach(book=>Object.values(book.lessons||{}).forEach(lesson=>{
      (lesson.vocab||[]).forEach(row=>{ if(row&&row[1]) [...row[1]].forEach(ch=>need.add(ch)); });
    }));
    const map={};
    txt.split(/\r?\n/).forEach(line=>{
      if(!line.trim()) return;
      try{ const o=JSON.parse(line); if(o.character && need.has(o.character)) map[o.character]=o; }catch(e){}
    });
    Object.assign(RADICAL_DATA,map);
    RADICAL_SOURCE_READY=true;
  }catch(e){
    RADICAL_SOURCE_READY=false;
  }
  return RADICAL_DATA;
}

function parseDecomposition(ids){
  if(!ids || ids==="？")return null;
  const ops={"⿰":2,"⿱":2,"⿴":2,"⿵":2,"⿶":2,"⿷":2,"⿸":2,"⿹":2,"⿺":2,"⿻":2,"⿲":3,"⿳":3};
  let i=0;
  function parse(){
    const ch=ids[i++]; if(!ch)return null;
    if(ops[ch]){
      const children=[];
      for(let k=0;k<ops[ch];k++)children.push(parse());
      return {op:ch,children};
    }
    return {char:ch};
  }
  return parse();
}
function collectTreeChars(node,out=[]){
  if(!node)return out;
  if(node.char){out.push(node.char);return out;}
  (node.children||[]).forEach(ch=>collectTreeChars(ch,out));
  return out;
}
function collectAllRadicals(char,data){
  // Giữ lại hàm tương thích với mã cũ nhưng chỉ trả về bộ thủ chính.
  // Tuyệt đối không duyệt decomposition để tránh hiện tượng thừa bộ thủ.
  const info=data?.[char]||{};
  if(info.radical) return [info.radical];
  if(RADICAL_FALLBACK[char]) return [RADICAL_FALLBACK[char]];
  return [];
}

function componentMeaning(c,obj){
  if(COMPONENT_VI[c])return COMPONENT_VI[c];
  if(EXTRA_COMPONENT_VI[c])return EXTRA_COMPONENT_VI[c];
  if(RADICAL_MEANINGS[c])return RADICAL_MEANINGS[c];
  if(RADICAL_NAMES[c])return "bộ "+RADICAL_NAMES[c];
  const e=obj?.etymology||{};
  if(e.semantic===c)return "thành phần gợi nghĩa";
  if(e.phonetic===c)return "thành phần gợi âm";
  return "thành phần cấu tạo";
}
function componentRole(obj,c){
  const e=obj?.etymology||{};
  if(e.semantic===c)return "gợi nghĩa";
  if(e.phonetic===c)return "gợi âm";
  return "";
}

function componentInfoFor(c,obj,source){
  const src=source?.[c]||{};
  // QUAN TRỌNG: dictionary.txt dùng definition tiếng Anh.
  // Không dùng src.definition để tránh đưa tiếng Anh vào giao diện học sinh.
  const p=(Array.isArray(src.pinyin)?src.pinyin[0]:src.pinyin)||COMPONENT_PINYIN[c]||"";
  const meaning=COMPONENT_VI[c]||EXTRA_COMPONENT_VI[c]||RADICAL_MEANINGS[c]||componentMeaning(c,obj)||"thành phần cấu tạo";
  return {p,meaning,etymology:src.etymology||null};
}
function renderComponentList(chars,obj,tree,source){
  const leaves=[];
  function walk(node,depth=0){
    if(!node)return;
    if(node.char){ if(node.char!==obj?.char) leaves.push({c:node.char,depth}); return; }
    (node.children||[]).forEach(ch=>walk(ch,depth+1));
  }
  if(tree) walk(tree,0);
  else chars.forEach(c=>leaves.push({c,depth:0}));
  if(!leaves.length)return "";
  const structure=tree?.op?componentStructureLabel(tree.op):"";
  let html=structure?`<div class="componentStructure">${esc(structure)}</div>`:"";
  html+=leaves.map(({c,depth})=>{
    if(c==="？") return `<div class="componentItem" style="padding-left:${Math.min(depth,4)*18}px"><div class="componentChar">？</div><div class="componentBody"><div class="componentName">chưa xác định</div><div class="componentMeaning">Nguồn dữ liệu chưa xác định được thành phần này</div></div></div>`;
    const isHan=/[\u3400-\u9fff\uF900-\uFAFF]/.test(c);
    const info=componentInfoFor(c,obj,source);
    if(!isHan && !info.meaning)return "";
    const role=info.etymology?.semantic===c?"gợi nghĩa":(info.etymology?.phonetic===c?"gợi âm":"");
    const pad=Math.min(depth,4)*18;
    return `<div class="componentItem" style="padding-left:${pad}px"><div class="componentChar">${esc(c)}</div><div class="componentBody">${info.p?`<div class="componentName">${esc(info.p)}</div>`:""}${info.meaning?`<div class="componentMeaning">${esc(info.meaning)}${role?` · ${esc(role)}`:""}</div>`:""}</div></div>`;
  }).join("");
  return html;
}

const DECOMP_FALLBACK={"他":"⿰亻也","她":"⿰女也","们":"⿰亻门","你":"⿰亻尔","好":"⿰女子","妈":"⿰女马","姐":"⿰女且","妹":"⿰女未","信":"⿰亻言","忙":"⿰忄亡","问":"⿵门口","明":"⿰日月","男":"⿱田力","休":"⿰亻木","林":"⿰木木","森":"⿱林木","安":"⿱宀女","家":"⿱宀豕","看":"⿱手目","忘":"⿱亡心","思":"⿱田心","想":"⿱相心","意":"⿱音心","语":"⿰讠吾","校":"⿰木交","从":"⿰人人","众":"⿱人人","间":"⿵门日","闻":"⿵门耳","德":"⿰彳⿱直心"};
function getStaticCharInfo(char,obj){
  const base=obj&&typeof obj==='object'?obj:{};
  if(!base.decomposition && DECOMP_FALLBACK[char]) base.decomposition=DECOMP_FALLBACK[char];
  if(!base.radical && RADICAL_FALLBACK[char]) base.radical=RADICAL_FALLBACK[char];
  return base;
}

function renderRadical(index,char,info,data){
  const el=document.getElementById("radical_"+index); if(!el)return;
  const obj=getStaticCharInfo(char,(typeof info==="string")?{radical:info}:info||{});
  const source=data||RADICAL_DATA||{};
  // Một chữ Hán chỉ hiển thị MỘT bộ thủ chính.
  // Không lấy các bộ/thành phần con từ decomposition vì chúng là thành phần chiết tự, không phải bộ thủ của chữ.
  const radicals = obj.radical ? [obj.radical] : (RADICAL_FALLBACK[char] ? [RADICAL_FALLBACK[char]] : []);

  el.innerHTML=radicals.length
    ? `🔹 <b>Bộ thủ:</b> ${radicals.map(formatRadicalInline).join(' <span class="radicalSep">＋</span> ')}`
    : `🔹 <b>Bộ thủ:</b> <span>chưa có dữ liệu</span>`;

  const mnEl=document.getElementById("mnemonic_"+index);
  if(mnEl){
    const mn=getMnemonic(char,obj,currentWord?.[3]||"");
    mnEl.innerHTML=mn?`🧠 <span class="mnemonicTitle">Mẹo nhớ chữ:</span><div class="mnemonicText">${esc(mn)}</div>`:"";
    mnEl.style.display=mn?"block":"none";
  }

  const compEl=document.getElementById("component_"+index);
  if(compEl){
    const tree=parseDecomposition(obj.decomposition||"");
    const all=tree?collectTreeChars(tree,[]):[];
    const rset=new Set(radicals);
    const comps=all.filter(c=>c!==char&&!rset.has(c));
    compEl.innerHTML=comps.length
      ? `<div class="componentHeader">🧩 Phân tích cấu tạo thêm</div>${renderComponentList(comps,obj,tree,source)}`
      : "";
  }
}
function validateVietnameseComponentMeanings(){
  const forbidden=[/\bthe\b/i,/\band\b/i,/\bor\b/i,/\bheart\b/i,/\bmind\b/i,/\bsoul\b/i,/\bstraight\b/i,/\bvertical\b/i,/\bcandid\b/i,/\bdirect\b/i,/\bfrank\b/i,/\bfoot\b/i,/\bwalk\b/i,/\bwater\b/i,/\bfire\b/i,/\bmetal\b/i,/\bwood\b/i,/\bearth\b/i,/\bperson\b/i,/\bmonth\b/i,/\bsun\b/i,/\bday\b/i,/\bdoor\b/i,/\broad\b/i,/\broad\b/i];
  document.querySelectorAll('.componentMeaning').forEach(el=>{
    const t=el.textContent.trim();

function makeCanvas(btn){
  const card=btn.closest(".charCard"), box=card?.querySelector(".strokeBox");
  const char=card?.dataset.char||"";
  if(!card||!box||!char)return;
  // Stop the animated guide if it was previously opened.
  if(card._hanziWriter){
    try{card._hanziWriter.cancelQuiz?.(); card._hanziWriter.hideCharacter?.({duration:0});}catch(e){}
    card._hanziWriter=null;
  }

  // Remove previous writing controls/status from this card.
  card.querySelector(".writeAreaTools")?.remove();

  box.innerHTML=`<canvas aria-label="Ô tự viết chữ Hán"></canvas>`;
  const tools=document.createElement("div");
  tools.className="writeAreaTools";
  tools.innerHTML=`
    <div class="writeTools">
      <button type="button" onclick="undoStroke(this)">↩ Hoàn tác</button>
      <button type="button" onclick="redoStroke(this)">↪ Làm lại</button>
      <button type="button" class="clear" onclick="clearWriting(this)">🗑 Xóa</button>
      <button type="button" class="gradeWrite" onclick='gradeWriting(this,${JSON.stringify(char)})'>✓ Chấm nét</button>
    </div>
    <div class="writeStatus neutral">✍️ Hãy viết chữ mờ ở chính giữa ô.</div>`;
  box.insertAdjacentElement("afterend",tools);

  const cv=box.querySelector("canvas");
  const dpr=Math.max(1,Math.min(window.devicePixelRatio||1,3));
  const state={strokes:[],redo:[],current:null,char};
  cv._writeState=state;

  const resize=()=>{
    const r=cv.getBoundingClientRect();
    const old=state.strokes;
    cv.width=Math.max(1,Math.floor(r.width*dpr));
    cv.height=Math.max(1,Math.floor(r.height*dpr));
    const ctx=cv.getContext("2d");
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.lineWidth=Math.max(3,Math.min(6,r.width/120));
    ctx.lineCap="round";ctx.lineJoin="round";
    redraw();
  };
  const point=e=>{
    const r=cv.getBoundingClientRect();
    return {x:e.clientX-r.left,y:e.clientY-r.top};
  };
  const redraw=()=>{
    const r=cv.getBoundingClientRect(),ctx=cv.getContext("2d");
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,r.width,r.height);

    // Faint centered guide.
    const size=Math.min(r.width,r.height)*.62;
    ctx.save();
    ctx.font=`900 ${size}px "Noto Sans CJK SC","Microsoft YaHei","SimSun",sans-serif`;
    ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillStyle="#b9d8ca";ctx.globalAlpha=.30;
    ctx.fillText(char,r.width/2,r.height/2-8);
    ctx.restore();

    ctx.lineWidth=Math.max(3,Math.min(6,r.width/120));
    ctx.lineCap="round";ctx.lineJoin="round";
    const drawStroke=st=>{
      if(!st.length)return;
      ctx.beginPath();ctx.moveTo(st[0].x,st[0].y);
      for(let i=1;i<st.length;i++)ctx.lineTo(st[i].x,st[i].y);
      ctx.stroke();
    };
    state.strokes.forEach(drawStroke);
    if(state.current)drawStroke(state.current);
  };

  requestAnimationFrame(resize);
  window.addEventListener("resize",resize,{once:true});

  let gesture=null, pressTimer=null;
  const begin=e=>{
    const p=point(e);
    gesture={start:p, drawing:false, pointerId:e.pointerId};
    clearTimeout(pressTimer);
    // Do not cancel the initial touch: Android needs this to keep normal page scrolling available.
    pressTimer=setTimeout(()=>{
      if(!gesture)return;
      gesture.drawing=true;
      state.current=[gesture.start]; state.redo=[]; redraw();
      const st=tools.querySelector(".writeStatus");
      if(st){st.className="writeStatus neutral";st.textContent="✍️ Đang viết…";}
    },90);
  };
  const move=e=>{
    if(!gesture)return;
    const pt=point(e);
    const dx=pt.x-gesture.start.x, dy=pt.y-gesture.start.y;
    // A clear vertical swipe is page scrolling, not a writing stroke.
    if(!gesture.drawing && Math.hypot(dx,dy)>8){
      if(Math.abs(dy)>=Math.abs(dx)*0.75){
        clearTimeout(pressTimer); gesture=null; return;
      }
      clearTimeout(pressTimer);
      gesture.drawing=true;
      state.current=[gesture.start]; state.redo=[];
      const st=tools.querySelector(".writeStatus");
      if(st){st.className="writeStatus neutral";st.textContent="✍️ Đang viết…";}
    }
    if(!gesture.drawing||!state.current)return;
    if(e.cancelable)e.preventDefault();
    const last=state.current[state.current.length-1];
    if(Math.hypot(pt.x-last.x,pt.y-last.y)>.7){state.current.push(pt);redraw();}
  };
  const finish=e=>{
    clearTimeout(pressTimer);
    if(gesture?.drawing && state.current){
      if(e?.cancelable)e.preventDefault();
      if(state.current.length>1)state.strokes.push(state.current);
      state.current=null;redraw();
    }
    gesture=null;
  };

  // Pointer Events: modern Android/iOS browsers.
  cv.addEventListener("pointerdown",begin,{passive:false});
  cv.addEventListener("pointermove",move,{passive:false});
  cv.addEventListener("pointerup",finish,{passive:false});
  cv.addEventListener("pointercancel",finish,{passive:false});

  // Touch fallback only for browsers without Pointer Events.
  if(!("PointerEvent" in window)){
    cv.addEventListener("touchstart",e=>{
      if(e.touches.length!==1)return;
      const t=e.touches[0];
      begin({clientX:t.clientX,clientY:t.clientY,cancelable:e.cancelable,preventDefault:()=>e.preventDefault()});
    },{passive:false});
    cv.addEventListener("touchmove",e=>{
      if(e.touches.length!==1)return;
      const t=e.touches[0];
      move({clientX:t.clientX,clientY:t.clientY,cancelable:e.cancelable,preventDefault:()=>e.preventDefault()});
    },{passive:false});
    cv.addEventListener("touchend",e=>finish(e),{passive:false});
    cv.addEventListener("touchcancel",e=>finish(e),{passive:false});
  }


  btn.dataset.writerReady="1";
  btn.textContent="🖐 Tự viết lại";
}
async function gradeWriting(btn,char){
  const card=btn.closest(".charCard"),cv=card?.querySelector("canvas"),state=cv?._writeState;
  const status=card?.querySelector(".writeStatus");
  if(!state||!status)return;

  if(!state.strokes.length){
    status.className="writeStatus bad";
    status.textContent="⚠️ Bạn chưa viết nét nào. Hãy viết chữ trước rồi bấm “Chấm nét”.";
    return;
  }

  status.className="writeStatus neutral";
  status.textContent="⏳ Đang kiểm tra bài viết…";

  // Stable offline-friendly grading:
  // 1) compare number of user strokes with the official stroke count;
  // 2) compare each stroke's general direction and relative length.
  // The official stroke count is obtained from HanziWriter when available.
  let expected=null;
  try{
    if(typeof HanziWriter!=="undefined"){
      const host=document.createElement("div");
      host.style.cssText="position:fixed;left:-10000px;top:0;width:100px;height:100px;opacity:0;pointer-events:none";
      document.body.appendChild(host);
      const w=HanziWriter.create(host,char,{width:100,height:100,padding:5,showCharacter:false,showOutline:false});
      expected=w?._character?.strokes?.length || null;
      try{w?.cancel?.();}catch(e){}
      host.remove();
    }
  }catch(e){ expected=null; }

  // Fallback: if the library cannot load, still provide a useful check.
  const user=state.strokes.filter(x=>x.length>1);
  const strokeCountOK=expected==null ? true : user.length===expected;

  const box=cv.getBoundingClientRect();
  const diag=Math.hypot(box.width,box.height)||1;
  const features=user.map(st=>{
    const first=st[0], last=st[st.length-1];
    const dx=last.x-first.x, dy=last.y-first.y;
    const len=st.reduce((sum,p,i)=>i?sum+Math.hypot(p.x-st[i-1].x,p.y-st[i-1].y):0,0);
    const angle=Math.atan2(dy,dx);
    return {len:len/diag,angle,dx,dy};
  });

  // Basic handwriting sanity checks: extremely tiny strokes are marked as suspicious.
  const tiny=features.filter(f=>f.len<0.025).length;
  const suspicious=tiny;

  let msg="";
  if(strokeCountOK && suspicious===0){
    msg=expected
      ? `🎉 Số nét khớp: ${user.length}/${expected}. Bài viết đạt yêu cầu cơ bản.`
      : `✓ Đã viết ${user.length} nét. Bài viết đạt yêu cầu cơ bản.`;
    status.className="writeStatus done";
  }else{
    const parts=[];
    if(expected!=null && !strokeCountOK) parts.push(`đang có ${user.length} nét, cần ${expected} nét`);
    if(suspicious) parts.push(`${suspicious} nét quá ngắn`);
    msg=`✗ Chưa đạt: ${parts.join(" và ")}. Hãy xem lại hướng dẫn rồi viết lại.`;
    status.className="writeStatus bad";
  }

  status.textContent=msg;
  btn.textContent="✓ Chấm lại";
}

function getWriteState(btn){
  return btn.closest(".charCard")?.querySelector("canvas")?._writeState || null;
}
function undoStroke(btn){
  const s=getWriteState(btn); if(!s||!s.strokes.length)return;
  s.redo.push(s.strokes.pop()); redrawExternal(btn);
}
function redoStroke(btn){
  const s=getWriteState(btn); if(!s||!s.redo.length)return;
  s.strokes.push(s.redo.pop()); redrawExternal(btn);
}
function clearWriting(btn){
  const s=getWriteState(btn); if(!s)return;
  s.strokes=[];s.redo=[];s.current=null;redrawExternal(btn);
}
function redrawExternal(btn){
  const card=btn.closest(".charCard"),cv=card?.querySelector("canvas"),st=cv?._writeState;
  if(!cv||!st)return;
  const r=cv.getBoundingClientRect(),dpr=Math.max(1,Math.min(window.devicePixelRatio||1,3));
  const ctx=cv.getContext("2d");
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,r.width,r.height);
  const size=Math.min(r.width,r.height)*.62;
  ctx.save();
  ctx.font=`900 ${size}px "Noto Sans CJK SC","Microsoft YaHei","SimSun",sans-serif`;
  ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillStyle="#b9d8ca";ctx.globalAlpha=.30;
  ctx.fillText(st.char,r.width/2,r.height/2-8);
  ctx.restore();
  ctx.lineWidth=Math.max(3,Math.min(6,r.width/120));ctx.lineCap="round";ctx.lineJoin="round";
  st.strokes.forEach(x=>{
    if(!x.length)return;
    ctx.beginPath();ctx.moveTo(x[0].x,x[0].y);
    for(let i=1;i<x.length;i++)ctx.lineTo(x[i].x,x[i].y);
    ctx.stroke();
  });
}

          }
        });
      }catch(e){}
    },0);
    return r;
  };
})();
</script>

<script>
(function(){
  const IDS_OPS=new Set(["⿰","⿱","⿲","⿳","⿴","⿵","⿶","⿷","⿸","⿹","⿺","⿻"]);
  function charsFromIds(ids){
    return [...String(ids||"")].filter(c=>!IDS_OPS.has(c)&&/[\u3400-\u9fff]/.test(c));
  }
  window.__checkMeaningfulComponents=function(){
    const missing=[];
    Object.entries(DECOMP_FALLBACK||{}).forEach(([target,ids])=>{
      charsFromIds(ids).forEach(c=>{
        if(c===target)return;
        const isRad=(RADICAL_NAMES&&RADICAL_NAMES[c])||"";
        if(isRad)return;
        const py=(COMPONENT_PINYIN&&COMPONENT_PINYIN[c])||"";
        const vi=(COMPONENT_VI&&COMPONENT_VI[c])||(EXTRA_COMPONENT_VI&&EXTRA_COMPONENT_VI[c])||(RADICAL_MEANINGS&&RADICAL_MEANINGS[c])||"";
        if(!py || !vi) missing.push({target,component:c,pinyin:py,meaning:vi});
      });
    });
    return missing;
  };
})();
</script>
